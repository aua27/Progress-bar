# Release: release-please maintains CHANGELOG.md + version-bump PRs on every
# push to master; when a release PR is merged and the GitHub release is
# created, the package is tested and published to npm with provenance.
#
# REQUIRED REPO SETUP (one-time, manual):
# 1. NPM_TOKEN secret (Settings → Secrets and variables → Actions):
#    an npm *automation* token from a 2FA-enabled npm account with publish
#    rights to the `npmbar` package (automation tokens bypass the 2FA prompt
#    in CI).
# 2. Actions workflow permissions (Settings → Actions → General →
#    Workflow permissions): enable "Read and write permissions" AND
#    "Allow GitHub Actions to create and approve pull requests" — both are
#    needed for release-please to push release branches and open version PRs.
# 3. npm provenance requires the repository.url in package.json to match this
#    GitHub repo (it does) and publishing from GitHub-hosted runners (it is).

name: Release

on:
  push:
    branches: [master]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create release branches, tags, GitHub releases
      pull-requests: write # open/update the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # No release-type input: manifest mode, so release-please-config.json
      # and .release-please-manifest.json control versioning (0.9.x line).
      - uses: googleapis/release-please-action@v4
        id: release

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for `npm publish --provenance`
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
