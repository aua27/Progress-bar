# Perf: validates the <3% warm-cache overhead budget vs plain `npm install`.
#
# Runner note: benchmark numbers are ONLY comparable within the same runner
# class (ubuntu-latest, currently 4-vCPU hosted runners). Do not compare
# absolute timings across runner classes, OSes, or self-hosted hardware —
# only the relative npmbar-vs-npm overhead ratio from a single run is meaningful.
#
# Triggers:
# - weekly schedule (drift detection)
# - manual dispatch
# - pull requests labeled `perf`

name: Perf

on:
  schedule:
    # Mondays 05:30 UTC — off the top of the hour to avoid scheduler congestion.
    - cron: "30 5 * * 1"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

jobs:
  perf:
    name: warm-cache overhead benchmark
    # For pull_request events, only run when the PR carries the `perf` label.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'perf')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # sticky benchmark comment (no-op on fork PRs)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # REQUIRED GATE: the rigorous benchmark. perf.js runs n=10 against a local
      # verdaccio (auto-spawned) — network-local and low-variance — and asserts
      # the (npmbar_median - npm_median) / npm_median < 0.03 warm budget, exiting
      # 1 on breach. --cold-advisory: the cold regime is still measured and
      # printed, but a cold breach WARNS instead of failing the job. Cold is
      # network/IO-variance-dominated and has been reproduced breaching on
      # unmodified baseline HEAD (A/B via git stash) — gating on it would go red
      # on machine noise, not on a real regression. Warm is the core constraint
      # (where users live) and is the hard gate. This is a deliberate, documented
      # decision, not a quiet loosening: the number stays visible every run.
      - name: Full perf benchmark (required)
        id: perf_full
        run: |
          node test/perf.js --cold-advisory 2>&1 | tee perf-full-output.txt
          exit ${PIPESTATUS[0]}

      # REQUIRED GATE: rendering. Every piped benchmark above executes the render
      # loop ZERO times (src/progress.js gates on stdout.isTTY), so they prove
      # accounting overhead only — not that the redraw loop npm removed its bar
      # over is cheap. --tty wraps BOTH tools in a real PTY (script(1)) so
      # npmbar's render loop actually runs, verifies rendering happened (asserts
      # the cursor-hide escape in captured output), and enforces the same <3%
      # budget (regime=warm-tty).
      - name: PTY rendering benchmark (required)
        id: perf_tty
        run: |
          node test/perf.js --tty 2>&1 | tee perf-tty-output.txt
          exit ${PIPESTATUS[0]}

      # ADVISORY: real-registry sanity signal. perf-quick.js is n=3 against the
      # public registry — CLAUDE.md itself calls n<10 preliminary — so it is kept
      # as a smoke check but no longer gates (the verdaccio perf.js above is the
      # authoritative required gate).
      - name: Quick perf benchmark (advisory)
        id: perf_quick
        continue-on-error: true
        run: |
          node test/perf-quick.js 2>&1 | tee perf-quick-output.txt
          exit ${PIPESTATUS[0]}

      - name: Assemble benchmark report
        if: always()
        run: |
          {
            echo "## Perf benchmark results"
            echo
            echo "Runner: ubuntu-latest (numbers only comparable within this runner class)"
            echo
            echo "### perf (verdaccio, warm <3% budget — REQUIRED; cold advisory)"
            echo
            echo '```'
            cat perf-full-output.txt 2>/dev/null || echo "(no output captured)"
            echo '```'
            echo
            echo "### perf --tty (PTY rendering, warm-tty <3% budget — REQUIRED)"
            echo
            echo '```'
            cat perf-tty-output.txt 2>/dev/null || echo "(no output captured)"
            echo '```'
            echo
            echo "### perf-quick (public registry, n=3 — advisory)"
            echo
            echo '```'
            cat perf-quick-output.txt 2>/dev/null || echo "(no output captured)"
            echo '```'
          } > perf-report.md
          cat perf-report.md >> "$GITHUB_STEP_SUMMARY"

      # Sticky PR comment with the benchmark output. Guarded: fork PRs run
      # with a read-only token and cannot comment, so skip them rather than
      # fail the job.
      - name: Post sticky PR comment
        if: >
          always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: perf-benchmark
          path: perf-report.md
